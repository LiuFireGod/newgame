<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户管理</title>
<style>
  :root {
    --bg: #0d0d12; --bg-secondary: #1a1a22; --card: #171720;
    --border: #2a2a36; --text-primary: #f0eef6; --text-secondary: #9a97a6;
    --accent: #6c5ce7; --accent-light: #a29bfe; --green: #2ecc71; --red: #e74c3c;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text-primary); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; min-height:100vh; }
  .wrap { max-width:520px; margin:0 auto; padding:24px 16px 40px; }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  h1 { font-size:20px; }
  .meta { display:flex; gap:20px; font-size:14px; margin-bottom:16px; }
  .meta b { color:var(--accent-light); }
  .list { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); font-size:14px; }
  .row:last-child { border-bottom:none; }
  .tag-admin { color:var(--accent-light); font-size:12px; }
  .refresh { background:var(--accent); border:none; color:#fff; padding:8px 16px; border-radius:9px; cursor:pointer; font-size:14px; }
  .refresh:active { opacity:.8; }
  .deny { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:32px; text-align:center; }
  .deny .icon { font-size:40px; margin-bottom:12px; }
  .deny p { color:var(--text-secondary); font-size:14px; margin-top:8px; }
  .btn-back { display:inline-block; margin-top:18px; color:var(--accent-light); text-decoration:none; font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
</div>
<script>
const SUPABASE_URL = 'https://ycxasrnnvwhcvzkmwhxu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_qALYuuKrijmsInYREJ8xyw_qkYJ8G7I';
const ADMIN_USERS = ['asd1316947244'];

async function supabaseRest(method, table, query, body) {
  const headers = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' };
  const opts = { method, headers };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + table + (query ? '?' + query : ''), opts);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function getCurrentUser() {
  try {
    const raw = localStorage.getItem('gh_current');
    if (!raw) return null;
    return JSON.parse(raw);
  } catch { return null; }
}
function isAdmin(u) {
  if (!u) return false;
  return ADMIN_USERS.includes(u.lname || u.name.toLowerCase());
}

function renderDeny() {
  document.getElementById('app').innerHTML = `
    <div class="deny">
      <div class="icon">🔒</div>
      <div style="font-size:16px;font-weight:600;">无权限访问</div>
      <p>该页面仅管理员可打开。<br>请先在社区首页登录管理员账号后重试。</p>
      <a class="btn-back" href="index.html">← 返回社区首页</a>
    </div>`;
}

async function loadUsers() {
  document.getElementById('app').innerHTML = `
    <div class="top"><h1>用户管理</h1><button class="refresh" onclick="loadUsers()">刷新</button></div>
    <div class="meta">
      <span>注册用户：<b id="uc">0</b></span>
      <span>当前在线：<b id="oc" style="color:var(--green);">0</b></span>
    </div>
    <div class="list" id="list"><div style="padding:14px;color:var(--text-secondary);">加载中…</div></div>`;
  let users = [];
  try {
    const rows = await supabaseRest('GET', 'users', 'select=name,lname&order=created_at.desc&limit=500');
    users = (rows || []).map(u => ({ name: u.name, lname: u.lname }));
  } catch(e) {}
  const seen = {};
  const list = users.filter(u => {
    const key = (u.lname || u.name || '').toLowerCase();
    if (seen[key]) return false;
    seen[key] = true;
    return true;
  });
  document.getElementById('uc').textContent = list.length;
  try {
    const cutoff = new Date(Date.now() - 60000).toISOString();
    const onrows = await supabaseRest('GET', 'online_users', 'last_seen=gt.' + encodeURIComponent(cutoff) + '&select=user_name');
    document.getElementById('oc').textContent = new Set((onrows || []).map(r => r.user_name)).size;
  } catch(e) { document.getElementById('oc').textContent = '?'; }
  document.getElementById('list').innerHTML = list.map((u,i) =>
    `<div class="row">
      <span>${i+1}. ${u.name}</span>
      ${ADMIN_USERS.includes(u.lname) ? '<span class="tag-admin">管理员</span>' : '<span style="color:var(--text-secondary);font-size:12px;">用户</span>'}
    </div>`
  ).join('') || '<div style="padding:14px;color:var(--text-secondary);">暂无注册用户</div>';
}

(function(){
  const u = getCurrentUser();
  if (!isAdmin(u)) { renderDeny(); return; }
  loadUsers();
})();
</script>
</body>
</html>
